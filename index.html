<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnivio Digital | Páginas de Vendas - Cardiologia</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .hub {
      text-align: center;
      max-width: 500px;
    }
    .hub h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }
    .hub h1 span { color: #00c878; }
    .hub p {
      color: #888;
      font-size: 0.92rem;
      margin-bottom: 40px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .links a {
      display: block;
      padding: 20px 28px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: 0.3s;
    }
    .links a:first-child {
      background: linear-gradient(135deg, #00c878, #009e5e);
      color: #fff;
      box-shadow: 0 4px 25px rgba(0,200,120,0.3);
    }
    .links a:first-child:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 35px rgba(0,200,120,0.4);
    }
    .links a:last-child {
      background: linear-gradient(135deg, #d4af37, #b8941e);
      color: #080c18;
      box-shadow: 0 4px 25px rgba(212,175,55,0.3);
    }
    .links a:last-child:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 35px rgba(212,175,55,0.4);
    }
  </style>
</head>
<body>
  <div class="hub">
    <h1>MAGNIVIO <span>DIGITAL</span></h1>
    <p>Selecione a versão da página de vendas para visualizar:</p>
    <div class="links">
      <a href="./a1/">🟢 Versão A1 — Cores Magnivio (Verde + Dark)</a>
      <a href="./a2/">🟡 Versão A2 — Teste A/B (Azul Navy + Dourado)</a>
    </div>
  </div>
</body>
</html>
