<svg viewBox="0 0 350 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#1e293b" />
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;900&amp;display=swap');
      .text-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 900; }
      .text-sub { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; letter-spacing: 0.25em; }
    </style>
  </defs>

      <g transform="translate(10, 10)">
        
  <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#boxGrad)" />
  <path d="M 0 20 H 80 M 0 40 H 80 M 0 60 H 80 M 20 0 V 80 M 40 0 V 80 M 60 0 V 80" stroke="#334155" strokeWidth="1" opacity="0.5" />
  <path d="M 5 45 L 15 45 L 25 15 L 40 55 L 55 15 L 65 45 L 75 45" stroke="#10b981" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round" filter="url(#neonGlow)"/>

      </g>
      <text x="110" y="55" className="text-title" fontSize="42" fill="#ffffff" letterSpacing="-1">Magnivio</text>
      <text x="114" y="80" className="text-sub" fontSize="15" fill="#10b981">DIGITAL</text>
    </svg>